# AegisKernel OpenTelemetry Collector Configuration
# High-throughput eBPF, Kafka/Redpanda, and GNN distributed telemetry pipeline

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'aegis-agent'
          scrape_interval: 5s
          static_configs:
            - targets: ['127.0.0.1:9100']
        - job_name: 'aegis-gnn-engine'
          scrape_interval: 5s
          static_configs:
            - targets: ['127.0.0.1:9101']
        - job_name: 'aegis-ai-swarm'
          scrape_interval: 5s
          static_configs:
            - targets: ['127.0.0.1:9102']

processors:
  batch:
    timeout: 100ms
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "aegis"
    send_timestamps: true

  logging:
    verbosity: normal

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus, logging]
