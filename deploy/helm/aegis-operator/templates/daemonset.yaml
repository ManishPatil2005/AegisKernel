apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aegis-kernel-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aegis-agent
    app.kubernetes.io/part-of: aegis-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-agent
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      containers:
        - name: aegis-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: {{ .Values.securityContext.privileged }}
            capabilities:
              add:
                {{- toYaml .Values.securityContext.capabilities.add | nindent 16 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: wal-buffer
              mountPath: /var/log/aegis-wal
      volumes:
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: proc
          hostPath:
            path: /proc
        - name: wal-buffer
          hostPath:
            path: /var/log/aegis-wal
            type: DirectoryOrCreate
