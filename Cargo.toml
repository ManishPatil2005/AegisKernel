[workspace]
resolver = "2"
members = [
    "crates/aegis-proto",
    "crates/aegis-core",
    "crates/aegis-agent",
    "crates/aegis-ebpf",
]

[workspace.package]
version = "0.1.0"
authors = ["AegisKernel Engineering Council <security@aegiskernel.io>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aegiskernel/aegiskernel"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
prost = "0.12"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
